<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone</title>
    <!-- CSS file link (GitHub / local folder ke liye) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-links">
            <a href="#">Gmail</a>
            <a href="#">Images</a>
            <div class="apps-icon" title="Google apps">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#5f6368">
                    <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6-12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path>
                </svg>
            </div>
            <a href="#" class="sign-in-btn">Sign in</a>
        </div>
    </header>

    <!-- Main Workspace Area -->
    <main>
        <!-- Google Logo -->
        <img class="logo" src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo" width="272" height="92">
        
        <!-- Search Box Container -->
        <div class="search-box-container">
            <div class="search-box">
                <div class="search-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                    </svg>
                </div>
                <input type="text" class="search-input" autofocus>
                <div class="input-tools">
                    <!-- Mic Icon -->
                    <div class="mic-icon" title="Search by voice">
                        <svg viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path fill="#34A853" d="M12 17c-3.31 0-6-2.69-6-6H4c0 4.07 3.06 7.43 7 7.93V22h2v-3.07c3.94-.5 7-3.86 7-7.93h-2c0 3.31-2.69 6-6 6z"/>
                        </svg>
                    </div>
                    <!-- Camera Icon -->
                    <div class="camera-icon" title="Search by image">
                        <svg viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
                            <path fill="#EA4335" d="M9 4.14A3 3 0 0 1 11.14 3h1.72A3 3 0 0 1 15 4.14L15.78 5H19a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h3.22L9 4.14zM12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="button-container">
            <button class="btn">Google Search</button>
            <button class="btn">I'm Feeling Lucky</button>
        </div>
    </main>

    <!-- Footer Area -->
    <footer>
        <div class="footer-top">
            India
        </div>
        <div class="footer-bottom">
            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="footer-links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
